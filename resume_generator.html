<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>職務経歴書ジェネレーター</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap');

  :root {
    --primary: #1a1a2e;
    --accent: #e94560;
    --accent2: #0f3460;
    --bg: #f8f7f4;
    --surface: #ffffff;
    --border: #e0ddd8;
    --text: #1a1a1a;
    --muted: #888;
    --section-bg: #f0ede8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--primary);
    color: white;
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header h1 {
    font-family: 'Noto Serif JP', serif;
    font-size: 20px;
    font-weight: 400;
    letter-spacing: 0.05em;
  }
  header .badge {
    background: var(--accent);
    color: white;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 500;
  }

  .container {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  .progress-bar {
    display: flex;
    gap: 0;
    margin-bottom: 32px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .progress-step {
    flex: 1;
    padding: 12px 8px;
    text-align: center;
    font-size: 12px;
    cursor: pointer;
    background: var(--surface);
    color: var(--muted);
    border-right: 1px solid var(--border);
    transition: all 0.2s;
    font-weight: 500;
  }
  .progress-step:last-child { border-right: none; }
  .progress-step.active {
    background: var(--primary);
    color: white;
  }
  .progress-step.done {
    background: var(--accent2);
    color: white;
  }

  .section-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px;
    margin-bottom: 24px;
  }

  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title .num {
    background: var(--accent);
    color: white;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
  }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  .field-row.full { grid-template-columns: 1fr; }
  .field-row.three { grid-template-columns: 1fr 1fr 1fr; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  label {
    font-size: 12px;
    font-weight: 500;
    color: var(--primary);
  }
  label .req {
    color: var(--accent);
    margin-left: 3px;
  }
  label .hint {
    color: var(--muted);
    font-weight: 400;
    font-size: 11px;
    margin-left: 4px;
  }

  input[type="text"], input[type="tel"], input[type="email"], input[type="date"], select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    background: white;
    transition: border-color 0.2s;
    color: var(--text);
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--accent2);
  }
  textarea { resize: vertical; line-height: 1.7; }

  .company-card {
    background: var(--section-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
    position: relative;
  }
  .company-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .company-num {
    font-size: 13px;
    font-weight: 700;
    color: var(--accent2);
  }
  .btn-remove {
    background: none;
    border: 1px solid #ddd;
    color: var(--muted);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .btn-remove:hover { border-color: var(--accent); color: var(--accent); }

  .btn-add {
    width: 100%;
    padding: 12px;
    border: 2px dashed var(--border);
    border-radius: 10px;
    background: none;
    color: var(--accent2);
    font-size: 13px;
    font-family: 'Noto Sans JP', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }
  .btn-add:hover { border-color: var(--accent2); background: rgba(15,52,96,0.04); }

  .skill-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
    align-items: center;
  }
  .skill-row input { flex: 1; }
  .btn-skill-remove {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
  }

  .generate-section {
    background: var(--primary);
    border-radius: 12px;
    padding: 28px;
    color: white;
    text-align: center;
  }
  .generate-section h3 {
    font-size: 16px;
    margin-bottom: 8px;
    font-family: 'Noto Serif JP', serif;
    font-weight: 400;
  }
  .generate-section p {
    font-size: 13px;
    color: rgba(255,255,255,0.7);
    margin-bottom: 20px;
  }

  .btn-generate {
    background: var(--accent);
    color: white;
    border: none;
    padding: 14px 40px;
    border-radius: 8px;
    font-size: 15px;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    letter-spacing: 0.05em;
  }
  .btn-generate:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  #output-section {
    display: none;
    margin-top: 32px;
  }
  #output-section.visible { display: block; }

  .output-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .output-header {
    background: var(--accent2);
    color: white;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .output-header h3 { font-size: 14px; font-weight: 500; }
  .btn-copy {
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
  }

  #output-text {
    padding: 24px;
    font-size: 13px;
    line-height: 2;
    white-space: pre-wrap;
    max-height: 500px;
    overflow-y: auto;
    color: var(--text);
  }

  .loading {
    text-align: center;
    padding: 40px;
    color: var(--muted);
    font-size: 14px;
  }
  .spinner {
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-right: 10px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .download-row {
    display: flex;
    gap: 12px;
    padding: 16px 24px;
    border-top: 1px solid var(--border);
  }
  .btn-dl {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    font-size: 13px;
    font-family: 'Noto Sans JP', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.2s;
    border: none;
  }
  .btn-dl:hover { opacity: 0.85; }
  .btn-dl-txt { background: var(--accent2); color: white; }
  .btn-dl-copy { background: var(--section-bg); color: var(--primary); border: 1px solid var(--border); }

  @media (max-width: 600px) {
    .field-row, .field-row.three { grid-template-columns: 1fr; }
    .container { padding: 16px 16px 80px; }
  }
</style>
</head>
<body>

<header>
  <h1>職務経歴書ジェネレーター</h1>
  <span class="badge">AI自動生成</span>
</header>

<div class="container">

  <!-- 基本情報 -->
  <div class="section-card">
    <div class="section-title">
      <span class="num">1</span> 候補者の基本情報
    </div>

    <div class="field-row">
      <div class="field">
        <label>氏名<span class="req">*</span></label>
        <input type="text" id="name" placeholder="例：森兼 将太">
      </div>
      <div class="field">
        <label>フリガナ</label>
        <input type="text" id="kana" placeholder="例：モリカネ ショウタ">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>生年月日</label>
        <input type="text" id="birthday" placeholder="例：1995年10月14日">
      </div>
      <div class="field">
        <label>性別</label>
        <select id="gender">
          <option value="">選択してください</option>
          <option value="男性">男性</option>
          <option value="女性">女性</option>
          <option value="回答しない">回答しない</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>電話番号</label>
        <input type="tel" id="phone" placeholder="例：090-1234-5678">
      </div>
      <div class="field">
        <label>メールアドレス</label>
        <input type="email" id="email" placeholder="例：sample@email.com">
      </div>
    </div>
    <div class="field-row full">
      <div class="field">
        <label>現住所</label>
        <input type="text" id="address" placeholder="例：岡山県岡山市北区○○">
      </div>
    </div>
  </div>

  <!-- 学歴 -->
  <div class="section-card">
    <div class="section-title">
      <span class="num">2</span> 学歴
    </div>
    <div class="field-row three">
      <div class="field">
        <label>高校名</label>
        <input type="text" id="hs-name" placeholder="例：広島国泰寺高等学校">
      </div>
      <div class="field">
        <label>卒業年月</label>
        <input type="text" id="hs-grad" placeholder="例：2015年3月">
      </div>
      <div class="field">
        <label>学科</label>
        <input type="text" id="hs-dept" placeholder="例：普通科">
      </div>
    </div>
    <div class="field-row three">
      <div class="field">
        <label>大学・専門学校名</label>
        <input type="text" id="univ-name" placeholder="例：北九州市立大学">
      </div>
      <div class="field">
        <label>卒業年月</label>
        <input type="text" id="univ-grad" placeholder="例：2019年3月">
      </div>
      <div class="field">
        <label>学部・学科</label>
        <input type="text" id="univ-dept" placeholder="例：経済学部 経営情報学科">
      </div>
    </div>
  </div>

  <!-- 免許・資格 -->
  <div class="section-card">
    <div class="section-title">
      <span class="num">3</span> 免許・資格
    </div>
    <div class="field-row full">
      <div class="field">
        <label>保有資格<span class="hint">（複数ある場合は改行して入力）</span></label>
        <textarea id="qualifications" rows="3" placeholder="例：
普通自動車第一種免許（2018年4月）
損害保険募集人資格（2019年4月）"></textarea>
      </div>
    </div>
  </div>

  <!-- 職歴 -->
  <div class="section-card">
    <div class="section-title">
      <span class="num">4</span> 職務経歴
      <span style="font-size:11px; color:var(--muted); font-weight:400; margin-left:auto">古い順に入力してください</span>
    </div>

    <div id="companies-container"></div>

    <button class="btn-add" onclick="addCompany()">＋ 会社を追加する</button>
  </div>

  <!-- スキル -->
  <div class="section-card">
    <div class="section-title">
      <span class="num">5</span> 活かせる経験・スキル
    </div>
    <div id="skills-container"></div>
    <button class="btn-add" onclick="addSkill()" style="margin-top:4px">＋ スキルを追加する</button>
  </div>

  <!-- 志望動機・自己PR -->
  <div class="section-card">
    <div class="section-title">
      <span class="num">6</span> 自己PR・転職理由
      <span style="font-size:11px; color:var(--muted); font-weight:400; margin-left:auto">AIが文章化します。箇条書きでもOK</span>
    </div>
    <div class="field-row full">
      <div class="field">
        <label>転職理由・志望動機のメモ<span class="hint">（走り書きでOK）</span></label>
        <textarea id="motivation" rows="3" placeholder="例：営業職からキャリアアップしたい、マネジメント経験を活かしたい、など"></textarea>
      </div>
    </div>
    <div class="field-row full">
      <div class="field">
        <label>希望条件</label>
        <input type="text" id="conditions" placeholder="例：マネージャー職、年収○○万以上、フルリモート希望 など">
      </div>
    </div>
  </div>

  <!-- 生成ボタン -->
  <div class="generate-section">
    <h3>入力が完了したら職務経歴書を生成</h3>
    <p>入力した情報をもとに、高精度な職務経歴書を自動作成します</p>
    <button class="btn-generate" onclick="generateResume()">✦ 職務経歴書を生成する</button>
  </div>

  <!-- 出力エリア -->
  <div id="output-section">
    <div class="output-card">
      <div class="output-header">
        <h3>✦ 生成された職務経歴書</h3>
        <button class="btn-copy" onclick="copyText()">コピー</button>
      </div>
      <div id="output-text"></div>
      <div class="download-row">
        <button class="btn-dl btn-dl-txt" onclick="downloadTxt()">テキストでダウンロード</button>
        <button class="btn-dl btn-dl-copy" onclick="copyText()">クリップボードにコピー</button>
      </div>
    </div>
  </div>

</div>

<script>
let companyCount = 0;
let skillCount = 0;
let generatedText = '';

function addCompany() {
  companyCount++;
  const n = companyCount;
  const container = document.getElementById('companies-container');
  const div = document.createElement('div');
  div.className = 'company-card';
  div.id = `company-${n}`;
  div.innerHTML = `
    <div class="company-card-header">
      <span class="company-num">第${n}社目</span>
      ${n > 1 ? `<button class="btn-remove" onclick="removeCompany(${n})">削除</button>` : ''}
    </div>
    <div class="field-row">
      <div class="field">
        <label>会社名<span class="req">*</span></label>
        <input type="text" id="c${n}-name" placeholder="例：パーソルテンプスタッフ株式会社">
      </div>
      <div class="field">
        <label>事業内容</label>
        <input type="text" id="c${n}-biz" placeholder="例：人材派遣・人材紹介">
      </div>
    </div>
    <div class="field-row three">
      <div class="field">
        <label>設立年</label>
        <input type="text" id="c${n}-founded" placeholder="例：1973年">
      </div>
      <div class="field">
        <label>資本金</label>
        <input type="text" id="c${n}-capital" placeholder="例：22億7300万円">
      </div>
      <div class="field">
        <label>従業員数</label>
        <input type="text" id="c${n}-employees" placeholder="例：78,119名">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>在籍期間<span class="req">*</span></label>
        <input type="text" id="c${n}-period" placeholder="例：2022年5月〜現在">
      </div>
      <div class="field">
        <label>部署・役職</label>
        <input type="text" id="c${n}-dept" placeholder="例：中四国営業部 岡山オフィス / チームリーダー">
      </div>
    </div>
    <div class="field-row full">
      <div class="field">
        <label>主な業務内容<span class="req">*</span><span class="hint">（箇条書きでOK）</span></label>
        <textarea id="c${n}-duties" rows="4" placeholder="例：
・法人向け新規営業（架電・飛び込み）
・人材派遣スタッフ85名の継続就業フォロー
・グループ商材（中途採用・ハイクラス紹介）のトスアップ
・チームリーダーとして部下3名のKPI管理"></textarea>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>担当顧客・ターゲット層</label>
        <input type="text" id="c${n}-target" placeholder="例：地場中小企業、地方銀行、大手企業支店">
      </div>
      <div class="field">
        <label>担当商材・サービス</label>
        <input type="text" id="c${n}-product" placeholder="例：人材派遣、中途採用紹介、紹介予定派遣">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>売上規模</label>
        <input type="text" id="c${n}-sales" placeholder="例：既存85件・月約2,975万円">
      </div>
      <div class="field">
        <label>チーム・職場規模</label>
        <input type="text" id="c${n}-team" placeholder="例：オフィス10名、うち営業4名">
      </div>
    </div>
    <div class="field-row full">
      <div class="field">
        <label>実績・数字<span class="req">*</span><span class="hint">（できるだけ数字で）</span></label>
        <textarea id="c${n}-results" rows="3" placeholder="例：
・予算比103%、対前年比106%達成
・2024年度パーソルグループ内グループ商材販売数2位
・2025年チームリーダー（課長補佐）昇進"></textarea>
      </div>
    </div>
    <div class="field-row full">
      <div class="field">
        <label>工夫したこと・強みとして伝えたいこと<span class="hint">（AIが文章化します）</span></label>
        <textarea id="c${n}-points" rows="3" placeholder="例：
・スタッフに寄り添う姿勢で長期就業率を高めた
・新規開拓では日当たりの行動管理を徹底
・表彰される実績づくりを常に意識"></textarea>
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label>退職理由</label>
        <input type="text" id="c${n}-reason" placeholder="例：一身上の都合（スキルアップのため）">
      </div>
      <div class="field">
        <label>昇進・昇格歴</label>
        <input type="text" id="c${n}-promotion" placeholder="例：2020年主任、2021年係長">
      </div>
    </div>
  `;
  container.appendChild(div);
}

function removeCompany(n) {
  const el = document.getElementById(`company-${n}`);
  if (el) el.remove();
}

function addSkill() {
  skillCount++;
  const n = skillCount;
  const container = document.getElementById('skills-container');
  const div = document.createElement('div');
  div.className = 'skill-row';
  div.id = `skill-${n}`;
  div.innerHTML = `
    <input type="text" id="s${n}-title" placeholder="例：迅速なレスポンス対応" style="width:180px; flex-shrink:0">
    <input type="text" id="s${n}-desc" placeholder="詳細（例：お客様からの問い合わせ一次対応はスピードが命と考え、即日返答を徹底）">
    <button class="btn-skill-remove" onclick="removeSkill(${n})">×</button>
  `;
  container.appendChild(div);
}

function removeSkill(n) {
  const el = document.getElementById(`skill-${n}`);
  if (el) el.remove();
}

function getVal(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

async function generateResume() {
  const btn = document.querySelector('.btn-generate');
  btn.disabled = true;
  btn.textContent = '生成中...';

  const outputSection = document.getElementById('output-section');
  outputSection.classList.add('visible');
  const outputText = document.getElementById('output-text');
  outputText.innerHTML = '<div class="loading"><span class="spinner"></span>AIが職務経歴書を作成しています...</div>';

  // データ収集
  const data = {
    name: getVal('name'),
    kana: getVal('kana'),
    birthday: getVal('birthday'),
    gender: getVal('gender'),
    phone: getVal('phone'),
    email: getVal('email'),
    address: getVal('address'),
    hs: { name: getVal('hs-name'), grad: getVal('hs-grad'), dept: getVal('hs-dept') },
    univ: { name: getVal('univ-name'), grad: getVal('univ-grad'), dept: getVal('univ-dept') },
    qualifications: getVal('qualifications'),
    motivation: getVal('motivation'),
    conditions: getVal('conditions'),
    companies: [],
    skills: []
  };

  // 会社情報収集
  for (let i = 1; i <= companyCount; i++) {
    const el = document.getElementById(`company-${i}`);
    if (!el) continue;
    const co = {
      name: getVal(`c${i}-name`),
      biz: getVal(`c${i}-biz`),
      founded: getVal(`c${i}-founded`),
      capital: getVal(`c${i}-capital`),
      employees: getVal(`c${i}-employees`),
      period: getVal(`c${i}-period`),
      dept: getVal(`c${i}-dept`),
      duties: getVal(`c${i}-duties`),
      target: getVal(`c${i}-target`),
      product: getVal(`c${i}-product`),
      sales: getVal(`c${i}-sales`),
      team: getVal(`c${i}-team`),
      results: getVal(`c${i}-results`),
      points: getVal(`c${i}-points`),
      reason: getVal(`c${i}-reason`),
      promotion: getVal(`c${i}-promotion`)
    };
    if (co.name) data.companies.push(co);
  }

  // スキル収集
  for (let i = 1; i <= skillCount; i++) {
    const el = document.getElementById(`skill-${i}`);
    if (!el) continue;
    const title = getVal(`s${i}-title`);
    const desc = getVal(`s${i}-desc`);
    if (title) data.skills.push({ title, desc });
  }

  const prompt = buildPrompt(data);

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 3000,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const result = await response.json();
    generatedText = result.content[0].text;
    outputText.textContent = generatedText;
    outputSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    outputText.innerHTML = '<div style="color:red;padding:20px">エラーが発生しました。もう一度お試しください。</div>';
  }

  btn.disabled = false;
  btn.textContent = '✦ 職務経歴書を生成する';
}

function buildPrompt(d) {
  const today = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });

  let companiesText = '';
  d.companies.forEach((co, idx) => {
    companiesText += `
【第${idx + 1}社目】
会社名：${co.name}
事業内容：${co.biz}
会社規模：設立${co.founded} 資本金${co.capital} 従業員数${co.employees}
在籍期間：${co.period}
部署・役職：${co.dept}
業務内容：${co.duties}
担当顧客：${co.target}
商材：${co.product}
売上規模：${co.sales}
チーム規模：${co.team}
実績：${co.results}
工夫・ポイント：${co.points}
退職理由：${co.reason}
昇進歴：${co.promotion}
`;
  });

  let skillsText = '';
  d.skills.forEach(s => {
    skillsText += `・${s.title}：${s.desc}\n`;
  });

  return `あなたは人材紹介会社のプロのキャリアアドバイザーです。以下の情報をもとに、企業の採用担当者に強く刺さる高品質な職務経歴書を作成してください。

【候補者情報】
氏名：${d.name}（${d.kana}）
生年月日：${d.birthday} ${d.gender}
電話：${d.phone}
メール：${d.email}
住所：${d.address}

【学歴】
高校：${d.hs.name} ${d.hs.dept} ${d.hs.grad}卒業
大学：${d.univ.name} ${d.univ.dept} ${d.univ.grad}卒業

【免許・資格】
${d.qualifications}

【職歴】
${companiesText}

【活かせるスキル】
${skillsText}

【転職理由・動機メモ】
${d.motivation}

【希望条件】
${d.conditions}

---

以下の形式・ルールに従って職務経歴書を作成してください：

1. 冒頭に「職務経歴書」タイトルと日付（${today}）、氏名を記載
2. 【職歴要約】セクション：2〜3段落で候補者の強みと経歴を簡潔に紹介（採用担当者が最初に読む部分）
3. 各社ごとに以下の構成で詳細を記載：
   - 会社基本情報（事業内容・設立・資本金・従業員数）
   - 在籍期間と部署・役職
   - 【業務内容】（箇条書きで具体的に）
   - 【担当顧客・商材・売上規模】
   - 【実績】（数字を活かして具体的に）
   - 【ポイント】（工夫したことや強みを2〜3点）
4. 【活かせる経験・知識・技術】セクション
5. 全体を通じて数字・具体性を重視し、採用担当者が読みやすい表現にしてください
6. 敬体（です・ます調）で統一
7. 転職理由は自然に前向きな表現に整えてください`;
}

function copyText() {
  if (!generatedText) return;
  navigator.clipboard.writeText(generatedText).then(() => {
    const btn = document.querySelector('.btn-copy');
    btn.textContent = 'コピーしました！';
    setTimeout(() => btn.textContent = 'コピー', 2000);
  });
}

function downloadTxt() {
  if (!generatedText) return;
  const name = getVal('name') || '候補者';
  const blob = new Blob([generatedText], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `職務経歴書_${name}.txt`;
  a.click();
}
